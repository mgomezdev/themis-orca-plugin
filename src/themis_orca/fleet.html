<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Themis Fleet</title>
<style>
  body { margin: 0; color: var(--orca-fg); background: var(--orca-bg); font-size: 13px; }
  main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--orca-border); }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--orca-accent); outline-offset: 2px; }
  p { margin: 12px; color: var(--orca-muted); }
  iframe { flex: 1; width: 100%; min-height: 0; border: 0; }
  [hidden] { display: none !important; }
</style>
<main id="fleet-workspace" data-token="PAGE_TOKEN" aria-label="Themis Fleet">
  <nav aria-label="Fleet views">
    <button id="open-fleet" type="button" disabled>Fleet</button>
    <button id="open-wall" type="button" disabled>Camera Wall</button>
    <button id="close-view" type="button" hidden>Close view</button>
  </nav>
  <p id="fleet-status" role="status">Waiting for Themis connection settings…</p>
  <iframe id="fleet-frame" title="Themis fleet"
    sandbox="allow-scripts allow-forms allow-same-origin allow-downloads" referrerpolicy="no-referrer" hidden></iframe>
</main>
<script>
(() => {
  const el = id => document.getElementById(id);
  const frame = el('fleet-frame');
  const status = el('fleet-status');
  const closeButton = el('close-view');
  const pageToken = el('fleet-workspace').dataset.token;
  let pendingView;
  function open(view) {
    pendingView = view;
    orca.postMessage({command: 'open', view, page_token: pageToken});
  }
  function closeView() {
    pendingView = undefined;
    frame.hidden = true;
    frame.removeAttribute('src');
    closeButton.hidden = true;
    status.hidden = false;
  }
  orca.onMessage(message => {
    if (message?.type === 'state') {
      closeView();
      status.textContent = message.status;
      el('open-fleet').disabled = false;
      el('open-wall').disabled = false;
    } else if (message?.type === 'view' && message.view === pendingView) {
      pendingView = undefined;
      status.textContent = 'Choose Fleet or Camera Wall.';
      status.hidden = true;
      frame.title = message.view === 'wall' ? 'Themis Camera Wall' : 'Themis Fleet';
      frame.src = message.url;
      frame.hidden = false;
      closeButton.hidden = false;
    }
  });
  el('open-fleet').addEventListener('click', () => open('fleet'));
  el('open-wall').addEventListener('click', () => open('wall'));
  closeButton.addEventListener('click', closeView);
  orca.postMessage({command: 'ready', page_token: pageToken});
})();
</script>
</html>
