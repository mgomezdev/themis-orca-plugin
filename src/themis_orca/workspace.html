<main id="projects-workspace" data-token="PAGE_TOKEN" aria-label="Themis project workspace">
  <div class="actions" aria-label="Project workspace navigation">
    <button id="browse-projects" type="button" disabled>Projects</button>
    <button id="new-project" type="button" disabled>New project</button>
    <button id="edit-import" type="button" hidden>Open imported project</button>
  </div>
  <p id="workspace-note" class="muted" role="status">Waiting for Themis connection settings…</p>
  <iframe id="projects-frame" title="Themis project workspace"
    sandbox="allow-scripts allow-forms allow-same-origin allow-downloads" referrerpolicy="no-referrer" hidden></iframe>
</main>
