[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "themis-orca"
version = "0.1.0.dev0"
description = "Send OrcaSlicer plates to Themis"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Michael Gomez"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
themis_orca = ["panel.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
