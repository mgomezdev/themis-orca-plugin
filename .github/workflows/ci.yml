name: Plugin checks
on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: node --test tests/panel_ui.test.cjs
      - run: python -m build --wheel
      - name: Install and smoke-test the built wheel outside the source tree
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I -c "import themis_orca; from themis_orca.refresh import BackgroundRefresh; from importlib.resources import files; assert not BackgroundRefresh().busy; assert 'Themis' in files('themis_orca').joinpath('panel.html').read_text(encoding='utf-8')"
      - uses: actions/upload-artifact@v4
        with:
          name: themis-orca-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: dist/*.whl
  themis-api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the verified Themis API baseline
        uses: actions/checkout@v4
        with:
          repository: mgomezdev/themis
          ref: be3500c5f4c69b3a5dc3dbd6dfcb4d2a74b47e09
          path: themis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e 'themis/backend[dev]'
      - name: Verify G-code project imports and fixed-job generation
        working-directory: themis/backend
        run: python -m pytest -c pyproject.toml -p tests.conftest ../../integration/test_themis_gcode.py -q
